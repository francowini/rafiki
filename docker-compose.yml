services:
  # ==================================================================
  # PostgreSQL Database
  # ==================================================================
  postgres:
    image: postgres:18.0
    container_name: rafiki-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      rafiki-network:
        ipv4_address: 10.10.0.2
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # ==================================================================
  # Rafiki Partner Service (Main Application)
  # ==================================================================
  partner-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: rafiki-service:latest
    container_name: rafiki-service
    restart: unless-stopped
    ports:
      - "3000:3000"   # API Server
      - "3010:3010"   # Debug/Metrics Server
    environment:
      # Database Configuration
      - PARTNER_DB_HOST=${PARTNER_DB_HOST:-postgres}
      - PARTNER_DB_PORT=${PARTNER_DB_PORT:-5432}
      - PARTNER_DB_USER=${PARTNER_DB_USER:-${POSTGRES_USER}}
      - PARTNER_DB_PASSWORD=${PARTNER_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      - PARTNER_DB_NAME=${PARTNER_DB_NAME:-${POSTGRES_DB}}
      - PARTNER_DB_SSLMODE=${PARTNER_DB_SSLMODE:-disable}
      - PARTNER_DB_DISABLETLS=${PARTNER_DB_DISABLETLS:-false}

      # Web Server Configuration
      - PARTNER_WEB_APIHOST=0.0.0.0:3000
      - PARTNER_WEB_DEBUGHOST=0.0.0.0:3010
      - PARTNER_WEB_READTIMEOUT=5s
      - PARTNER_WEB_WRITETIMEOUT=10s
      - PARTNER_WEB_IDLETIMEOUT=120s
      - PARTNER_WEB_SHUTDOWNTIMEOUT=20s
      - PARTNER_WEB_CORSALLOWEDORIGINS=${PARTNER_WEB_CORSALLOWEDORIGINS:-https://app.rafiki.lat,https://*.vercel.app}

      # Go Runtime Configuration
      - GOMAXPROCS=2
      - GOMEMLIMIT=128MiB
      - GOGC=100

      # Encryption Configuration
      - PARTNER_ENCRYPTION_KEY=${PARTNER_ENCRYPTION_KEY}

      # Telegram Configuration (optional)
      - PARTNER_TELEGRAM_BOTTOKEN=${PARTNER_TELEGRAM_BOTTOKEN:-}
      - PARTNER_TELEGRAM_WEBHOOKSECRET=${PARTNER_TELEGRAM_WEBHOOKSECRET:-}
      - PARTNER_TELEGRAM_MORNINGTIME=${PARTNER_TELEGRAM_MORNINGTIME:-08:00}
      - PARTNER_TELEGRAM_EVENINGTIME=${PARTNER_TELEGRAM_EVENINGTIME:-21:00}
      - PARTNER_TELEGRAM_TIMEZONE=${PARTNER_TELEGRAM_TIMEZONE:-America/Argentina/Buenos_Aires}

      # Anthropic Configuration (required when Telegram is enabled)
      - PARTNER_ANTHROPIC_APIKEY=${PARTNER_ANTHROPIC_APIKEY:-}
      - PARTNER_ANTHROPIC_MODEL=${PARTNER_ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      - PARTNER_ANTHROPIC_MAXTOKENS=${PARTNER_ANTHROPIC_MAXTOKENS:-500}
      - PARTNER_ANTHROPIC_TEMPERATURE=${PARTNER_ANTHROPIC_TEMPERATURE:-0.7}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Mount JWT keys for authentication (development keys)
      - ./zarf/keys:/app/zarf/keys:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/v1/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      rafiki-network:
        ipv4_address: 10.10.0.10
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: '0.5'

  # ==================================================================
  # Nginx - Reverse Proxy (Production Only)
  # ==================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: rafiki-nginx
    restart: unless-stopped
    ports:
      - "80:80"     # HTTP (redirect to HTTPS + Let's Encrypt challenges)
      - "443:443"   # HTTPS
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      partner-service:
        condition: service_healthy
    networks:
      rafiki-network:
        ipv4_address: 10.10.0.30
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.2'
    profiles:
      - production

  # ==================================================================
  # Certbot - SSL Certificate Management (Production Only)
  # ==================================================================
  certbot:
    image: certbot/certbot:latest
    container_name: rafiki-certbot
    volumes:
      - ./certbot/www:/var/www/certbot:rw
      - ./certbot/conf:/etc/letsencrypt:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      rafiki-network:
        ipv4_address: 10.10.0.31
    profiles:
      - production

# ==================================================================
# Volumes
# ==================================================================
volumes:
  postgres_data:
    driver: local

# ==================================================================
# Networks
# ==================================================================
networks:
  rafiki-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.10.0.0/24
          gateway: 10.10.0.1