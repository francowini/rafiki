version: '3.8'

# Production docker-compose override
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  partner-service:
    # Mount production keys from OUTSIDE the repo to prevent accidental deletion
    # Keys are stored in /var/lib/rafiki/keys (not affected by git clean)
    volumes:
      - /var/lib/rafiki/keys:/app/zarf/keys:ro  # Read-only mount

    environment:
      # Production-specific environment variables
      # CORS is already configured in docker-compose.yml for app.rafiki.lat
      # Add other production overrides here if needed
      - PARTNER_TEMPO_PROBABILITY=0.1  # 10% sampling in production (vs 100% in dev)

    restart: unless-stopped

  postgres:
    restart: unless-stopped

  tempo:
    restart: unless-stopped

  grafana:
    restart: unless-stopped
