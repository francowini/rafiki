version: '3.8'

# Production override for external database
# Usage: docker-compose -f docker-compose.yml -f docker-compose.external-db.yml -f docker-compose.prod.yml --profile production up -d

services:
  partner-service:
    environment:
      # Override database configuration to use external database
      # These variables are read directly from .env file with PARTNER_DB_* prefix
      - PARTNER_DB_HOST=${PARTNER_DB_HOST}
      - PARTNER_DB_PORT=${PARTNER_DB_PORT:-5432}
      - PARTNER_DB_USER=${PARTNER_DB_USER}
      - PARTNER_DB_PASSWORD=${PARTNER_DB_PASSWORD}
      - PARTNER_DB_NAME=${PARTNER_DB_NAME}
      - PARTNER_DB_SSLMODE=${PARTNER_DB_SSLMODE:-require}  # Enable SSL for external DB
      - PARTNER_DB_DISABLETLS=${PARTNER_DB_DISABLETLS:-false}

    # Remove dependency on local postgres since we're using external DB
    depends_on:
      tempo:
        condition: service_healthy
      # postgres dependency removed - using external database

  # Disable local PostgreSQL service by scaling to 0 replicas
  postgres:
    deploy:
      replicas: 0
    # Override healthcheck to always pass (since service won't actually run)
    healthcheck:
      test: ["CMD", "true"]
      interval: 1s
      timeout: 1s
      retries: 1
