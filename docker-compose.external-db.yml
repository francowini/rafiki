version: '3.8'

# Production override for external database
# Usage: docker-compose -f docker-compose.yml -f docker-compose.external-db.yml -f docker-compose.prod.yml --profile production up -d

services:
  partner-service:
    # Remove dependency on local postgres since we're using external DB
    # Database configuration is read from .env via docker-compose.yml (PARTNER_DB_* variables)
    depends_on:
      tempo:
        condition: service_healthy
      # postgres dependency removed - using external database

  # Disable local PostgreSQL service by scaling to 0 replicas
  postgres:
    deploy:
      replicas: 0
    # Override healthcheck to always pass (since service won't actually run)
    healthcheck:
      test: ["CMD", "true"]
      interval: 1s
      timeout: 1s
      retries: 1
