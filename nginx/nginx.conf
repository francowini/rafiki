# Rate limiting zone: 10MB can store ~160k IP addresses
# Rate: 10 requests per second per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# ==================================================================
# HTTP Server (Port 80)
# ==================================================================
# Purpose:
# 1. Let's Encrypt ACME challenge validation
# 2. Redirect all other traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.rafiki.lat;

    # Let's Encrypt ACME challenge location
    # Certbot writes validation files here during certificate issuance/renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# ==================================================================
# HTTPS Server (Port 443)
# ==================================================================
# Main API server with SSL/TLS encryption
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.rafiki.lat;

    # ==================================================================
    # SSL Certificate Configuration
    # ==================================================================
    # Certificates are managed by Certbot and stored in /etc/letsencrypt
    ssl_certificate /etc/letsencrypt/live/api.rafiki.lat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.rafiki.lat/privkey.pem;

    # ==================================================================
    # SSL Protocol and Cipher Configuration
    # ==================================================================
    # Modern configuration (supports TLS 1.2 and 1.3 only)
    ssl_protocols TLSv1.2 TLSv1.3;

    # Strong cipher suite (prioritizes forward secrecy)
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

    # Let clients choose their preferred cipher
    ssl_prefer_server_ciphers off;

    # ==================================================================
    # SSL Session Configuration
    # ==================================================================
    # Session cache: 10MB can store ~40,000 sessions
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # OCSP Stapling: Improves SSL handshake performance
    ssl_stapling on;
    ssl_stapling_verify on;

    # ==================================================================
    # Security Headers
    # ==================================================================
    # HSTS: Force HTTPS for 1 year (including subdomains)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Prevent clickjacking attacks
    add_header X-Frame-Options "DENY" always;

    # XSS Protection (legacy, but doesn't hurt)
    add_header X-XSS-Protection "1; mode=block" always;

    # ==================================================================
    # Client Configuration
    # ==================================================================
    # Maximum request body size (e.g., file uploads)
    client_max_body_size 10M;

    # ==================================================================
    # Proxy to Backend Service
    # ==================================================================
    # Main API routes (with rate limiting)
    location / {
        # Rate limiting: 10 req/s with burst of 20
        # nodelay: Don't delay burst requests
        limit_req zone=api_limit burst=20 nodelay;

        # Proxy to the Go backend service
        proxy_pass http://partner-service:3000;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed in the future)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ==================================================================
    # Health Check Endpoints (No Rate Limiting)
    # ==================================================================
    # Liveness probe: Is the service running?
    location /v1/liveness {
        limit_req off;  # No rate limiting for health checks

        proxy_pass http://partner-service:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Readiness probe: Is the service ready to accept traffic?
    location /v1/readiness {
        limit_req off;  # No rate limiting for health checks

        proxy_pass http://partner-service:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
